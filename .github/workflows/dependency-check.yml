name: Auditoría de Seguridad - Dependency-Check

on:
  push:
    branches: [ main, master, QA ]
  pull_request:
    branches: [ main, master, QA ]
  workflow_dispatch: # <--- Esto te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Ejecutar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: Dependency-Check
        continue-on-error: true
        with:
          project: 'Proyecto Monorepo QA - Grupo ${{ github.repository }}'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --disableNodeAudit
            --disablePnpmAudit

      - name: Subir Reporte de Vulnerabilidades como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-seguridad-owasp
          path: reports/dependency-check-report.html