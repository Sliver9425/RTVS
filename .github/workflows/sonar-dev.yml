name: SonarQube Analysis - RVRS Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Configuración del entorno global para soportar pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # Instalación compatible con entornos de CI sin verificar estrictamente las versiones del lockfile
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Descarga e instalación manual del Sonar Scanner CLI nativo para evadir la acción empaquetada
      - name: Install Sonar Scanner CLI
        run: |
          mkdir -p $HOME/.sonar
          curl -sSLo $HOME/.sonar/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -o -q $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH

      # Ejecución directa por CLI usando autenticación clásica por parámetro -Dsonar.login
      - name: Execute Sonar Scanner
        run: |
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=Red-Universitaria-de-Denuncias-Seguras \
            -Dsonar.projectName="Red-Universitaria-de-Denuncias-Seguras" \
            -Dsonar.sources=. \
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.venv/**,**/__pycache__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.pyc